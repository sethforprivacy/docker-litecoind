name: "Test build of image when Dockerfile is changed"

on:
  push:
    paths:
    - 'Dockerfile'
    branches-ignore:
    - master
  pull_request:
    paths:
    - 'Dockerfile'
  workflow_dispatch:

env:
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/litecoind

# Least privilege: test build never pushes; GHCR read is for the cache
permissions:
  contents: read

jobs:
  rebuild-container:
    name: "Build image with cache"
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare platform matrix for arm64
        if: runner.arch == 'ARM64'
        run: |
          echo "PLATFORM=linux/arm64" >> $GITHUB_ENV
          echo "DIGEST_NAME=arm64" >> $GITHUB_ENV
      - name: Prepare platform matrix for amd64
        if: runner.arch == 'X64'
        run: |
          echo "PLATFORM=linux/amd64" >> $GITHUB_ENV
          echo "DIGEST_NAME=amd64" >> $GITHUB_ENV
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      -
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Test build of image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          platforms: ${{ env.PLATFORM }}
          tags: litecoind:testing
          cache-from: type=registry,ref=${{ env.GHCR_REPO }}:latest
      - 
        name: Test-run image
        run: |
          docker run --rm litecoind:testing &
          PID=$!
          sleep 30
          kill -SIGINT $PID # this will return a non-zero exit code if the container dies early on
